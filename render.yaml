# Blueprint target. Review current Render pricing before provisioning paid resources.
services:
  - type: web
    name: stocksense
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app db upgrade && gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --threads 2
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: stocksense-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
databases:
  - name: stocksense-db
    plan: basic-256mb
    databaseName: stocksense
    user: stocksense
