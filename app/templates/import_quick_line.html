<article class="quick-item" data-quick-item data-import-line>
<input type="hidden" name="line_key" value="{{index}}">
<div class="quick-item-main"><span class="quick-item-icon" aria-hidden="true">▦</span><label>Product<input class="form-control" name="line_{{index}}_name" value="{{line.get('name','')}}" maxlength="120" required></label><label>Quantity<input class="form-control" type="number" min="1" step="1" name="line_{{index}}_quantity" value="{{line.get('quantity','')}}" required></label><label>Unit cost ($)<input class="form-control" type="number" min="0" step="0.01" name="line_{{index}}_cost" value="{{line.get('cost','')}}" required></label><button class="btn btn-sm btn-outline-danger" type="button" data-quick-remove aria-label="Remove {{line.get('name','item')}}">Remove</button></div>
{% if line.get('match','').startswith('Possible match:') %}<p class="small muted mt-2">{{line.match}}</p>{% endif %}<details class="mt-2"><summary class="small">{{'✓ Matched to your inventory · Change match or category' if line.get('product_id') else '+ New item · Match an existing item or change category'}}</summary><div class="form-grid mt-3"><label>Match inventory product<select class="form-select" name="line_{{index}}_product_id"><option value="">Add as a new product</option>{% for p in products %}<option value="{{p.id}}" {{'selected' if line.get('product_id','')|string==p.id|string}}>{{p.name}} · {{p.sku}}</option>{% endfor %}</select></label><label>Category<input class="form-control" name="line_{{index}}_category" maxlength="60" value="{{line.get('category') or 'General'}}"></label><label>Stock unit<input class="form-control" name="line_{{index}}_unit" maxlength="30" value="{{line.get('unit') or 'unit'}}"></label></div></details>
</article>
